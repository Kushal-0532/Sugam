<!doctype html>
<meta charset="utf-8">
<title>gfx</title>
<style>
@font-face{font-family:Brush;src:url(fonts/Handwriting/CaveatBrush-Regular.ttf)}
html,body{margin:0;background:transparent}
svg{display:block}
text{font-family:Brush,cursive}
text.te{font-family:"Noto Sans Telugu","Noto Sans Devanagari",Brush}
text.emo{font-family:"Noto Color Emoji"}
</style>
<svg id="s" width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- wobble: whole drawing, seed re-set 12x/s from seek() -->
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1350">
      <feTurbulence id="wt" type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
    <!-- bleed: washes spill past the ink, fixed seed -->
    <filter id="bleed" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="16"/>
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  1.3 0 0 0 -.5"/>
    </filter>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.02" numOctaves="3" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  .5 0 0 0 -.2"/>
    </filter>
    <mask id="hole" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1350">
      <rect width="1080" height="1350" fill="#fff"/>
      <rect x="30" y="230" width="474" height="1060" rx="40" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#hole)">
    <rect width="1080" height="1350" fill="#f4efe6"/>
    <rect width="1080" height="1350" filter="url(#fibre)" opacity=".5"/>
    <rect width="1080" height="1350" filter="url(#grain)" opacity=".55"/>
  </g>
  <g id="stage" filter="url(#wobble)"></g>
</svg>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="timeline.js"></script>
<script src="gfx.js"></script>
