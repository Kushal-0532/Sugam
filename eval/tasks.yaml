# One entry per recorded command; each has a _telugu and a _hindi clip in audio/<id>_<lang>.flac.
# stt: keyword groups written BEFORE the first transcription (Nov 6). A clip passes when every group has a hit
#      (case-insensitive substring). Each group lists Latin + Telugu + Devanagari spellings.
# kind: eval task (run_eval.py) or control (confirm/stop parsing only, no phone run).
# dry_run: the run stops before the commit tap (alarm Done, timer Start, Call, Send).
